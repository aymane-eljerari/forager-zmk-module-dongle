# This file generates the GitHub Actions matrix.
# For simple board + shield combinations, add them to the top level board and
# shield arrays, for more control, add individual board + shield combinations
# to the `include` property. You can also use the `cmake-args` property to
# pass flags to the build command and `artifact-name` to assign a name to
# distinguish build outputs from each other:
#
# board: [ "nice_nano_v2" ]
# shield: [ "corne_left", "corne_right" ]
# include:
#   - board: bdn9_rev2
#   - board: nice_nano_v2
#     shield: reviung41
#   - board: nice_nano_v2
#     shield: corne_left
#     cmake-args: -DCONFIG_ZMK_USB_LOGGING=y
#     artifact-name: corne_left_with_logging
#
---
include:
  # config/west.yml pins zmk at `revision: main`, a floating branch. Upstream
  # Zephyr renamed this board from seeeduino_xiao_ble to xiao_ble at some
  # point on main (confirmed both locally and in CI: "Invalid BOARD" for the
  # old name) — not something this repo changed, just drift from tracking
  # main instead of a pinned release.
  - board: xiao_ble
    shield: forager_dongle prospector_adapter
    snippet: studio-rpc-usb-uart
  - board: xiao_ble
    shield: forager_left rgbled_adapter
  - board: xiao_ble
    shield: forager_right rgbled_adapter
  - board: xiao_ble
    shield: settings_reset
  # - board: xiao_ble
  #   shield: forager_dongle
  #   snippet: zmk-usb-logging

