# This file generates the GitHub Actions matrix.
# For simple board + shield combinations, add them to the top level board and
# shield arrays, for more control, add individual board + shield combinations
# to the `include` property. You can also use the `cmake-args` property to
# pass flags to the build command and `artifact-name` to assign a name to
# distinguish build outputs from each other:
#
# board: [ "nice_nano_v2" ]
# shield: [ "corne_left", "corne_right" ]
# include:
#   - board: bdn9_rev2
#   - board: nice_nano_v2
#     shield: reviung41
#   - board: nice_nano_v2
#     shield: corne_left
#     cmake-args: -DCONFIG_ZMK_USB_LOGGING=y
#     artifact-name: corne_left_with_logging
#
---
include:
  # config/west.yml pins zmk at `revision: main`, a floating branch, which
  # has drifted twice on this board:
  #  1. Upstream Zephyr renamed it from seeeduino_xiao_ble to xiao_ble.
  #  2. Zephyr 4.1 added a dedicated ZMK-compat board variant/qualifier
  #     (nrf52840/zmk), and ZMK's CI now hard-errors ("the selected board is
  #     not set up for ZMK and there is a ZMK variant available") if you
  #     build the plain board instead: https://zmk.dev/blog/2025/12/09/zephyr-4-1#zmk-board-variant
  #     Confirmed via `west boards --board xiao_ble --format "{qualifiers}"`
  #     -> nrf52840,nrf52840/sense,nrf52840/zmk, and the /zmk variant is
  #     also a meaningfully different (larger) build than the plain one.
  #
  # Zephyr's Kconfig parser treats any deprecated-symbol warning as a hard
  # build error (KSCAN is currently flagged deprecated), which aborts every
  # combo below before it even gets a .config written — confirmed locally
  # both with and without this flag. -DCONFIG_WARN_DEPRECATED=n only
  # silences the notice, it doesn't change what gets built.
  #
  # prospector_adapter (display) is gone entirely, not just unselected: this
  # setup has no display, and prospector-zmk-module's Kconfig.defconfig has
  # its own defect (LV_DISP_DEF_REFR_PERIOD defined with no type) that's
  # *unconditionally* parsed for every combo regardless of shield — it was
  # aborting settings_reset and forager_left/right too, which don't even
  # reference it. Removed the whole project from config/west.yml rather
  # than just dropping its shield.
  #
  # forager_left/right (rgbled_adapter, no display module involved) also
  # need -DCONFIG_ZMK_USB=n: xiao_ble's own /zmk-variant defconfig sets
  # CONFIG_ZMK_USB=y unconditionally, which conflicts with these being
  # split peripherals (USB HID only applies to the central/dongle side) and
  # aborts the build as an unsatisfied-dependency warning. forager_dongle is
  # the central, so it correctly keeps ZMK_USB=y from the board default.
  - board: xiao_ble/nrf52840/zmk
    shield: forager_dongle
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_WARN_DEPRECATED=n
  - board: xiao_ble/nrf52840/zmk
    shield: forager_left rgbled_adapter
    cmake-args: -DCONFIG_WARN_DEPRECATED=n -DCONFIG_ZMK_USB=n
  - board: xiao_ble/nrf52840/zmk
    shield: forager_right rgbled_adapter
    cmake-args: -DCONFIG_WARN_DEPRECATED=n -DCONFIG_ZMK_USB=n
  - board: xiao_ble/nrf52840/zmk
    shield: settings_reset
    cmake-args: -DCONFIG_WARN_DEPRECATED=n
  # - board: xiao_ble/nrf52840/zmk
  #   shield: forager_dongle
  #   snippet: zmk-usb-logging

